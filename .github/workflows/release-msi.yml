name: Build and release MSI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt "pyinstaller>=6.10.0"

      - name: Cache faster-whisper model
        uses: actions/cache@v4
        with:
          path: ~\.cache\huggingface\hub
          key: faster-whisper-tiny-en-${{ runner.os }}

      - name: Download faster-whisper model
        shell: pwsh
        run: python -c "from faster_whisper import WhisperModel; WhisperModel('tiny.en')"

      - name: Read version from tag
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release tags must use vMAJOR.MINOR.PATCH, for example v1.0.4."
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run focused regression tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_app_settings.py tests/test_glanceable_dashboard.py

      - name: Build MSI
        shell: pwsh
        run: .\build_msi.ps1 -Version $env:VERSION

      - name: Generate checksum
        shell: pwsh
        run: |
          $msi = Get-ChildItem -LiteralPath release -Filter "Translator-$env:VERSION-x64.msi" -File
          $hash = (Get-FileHash -LiteralPath $msi.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($msi.Name)" | Out-File -LiteralPath "release\SHA256SUMS.txt" -Encoding ascii

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $repo = $env:GITHUB_REPOSITORY
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag `
              "release\Translator-$env:VERSION-x64.msi" `
              "release\SHA256SUMS.txt" `
              --repo $repo `
              --clobber
          } else {
            gh release create $tag `
              "release\Translator-$env:VERSION-x64.msi" `
              "release\SHA256SUMS.txt" `
              --repo $repo `
              --title "Translator $env:VERSION" `
              --generate-notes
          }
